[package]
name = "figcraft-figma-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded, read-only imports from the public Figma REST API"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = "2"

# The browser keeps the local .fig/REST-JSON import; PAT-based HTTP is desktop-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
