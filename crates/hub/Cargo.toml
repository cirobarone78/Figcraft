[package]
name = "figcraft-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft's CraftHub client path: the HubAdapter that maps the document onto craft-collab's generalized object/property model, the unified hub.* command catalog, deep links and presence projections (no networking — the session wiring lands behind the app's `crafthub` feature flag)"

[lints]
workspace = true

[dependencies]
figcraft-doc = { workspace = true }
# The generalized collaboration core (CraftHub spec §3.4): consumed by git reference exactly as
# the family consumes `craft-print`, pinned to the reviewed commit. Retargeted to the org's
# canonical home (storytold/craft-libs or storytold/crafthub) the day that PR merges — a one-line
# change, noted in this PR's description.
craft-collab = { git = "https://github.com/hasan-sdaif/crafthub", rev = "91ed152c63a2b43d9c66c9dd719d001627ca5ce1" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
figcraft-color = { workspace = true }
